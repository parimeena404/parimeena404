<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 800 200" width="800" height="200">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
        * {
          box-sizing: border-box;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .container {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: transparent;
        }
        .glass-panel {
          width: 90%;
          height: 80%;
          background: rgba(124, 58, 237, 0.05);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border-radius: 16px;
          border: 1px solid rgba(168, 85, 247, 0.2);
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
        }
        .glass-panel::before {
          content: "";
          position: absolute;
          top: 0; left: -100%;
          width: 50%; height: 100%;
          background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.1), transparent);
          animation: sweep 4s infinite linear;
        }
        @keyframes sweep {
          100% { left: 200%; }
        }
        .greeting {
          color: #A855F7;
          font-weight: 600;
          font-size: 1.1rem;
          margin-bottom: 8px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }
        .name {
          color: #ffffff;
          font-weight: 800;
          font-size: 3rem;
          margin: 0 0 12px 0;
          text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }
        .typewriter-box {
          display: inline-block;
        }
        .typewriter {
          color: #d1d5db;
          font-weight: 400;
          font-size: 1.25rem;
          overflow: hidden;
          border-right: .15em solid #38BDF8;
          white-space: nowrap;
          margin: 0 auto;
          letter-spacing: .05em;
          animation: typing 4s steps(45, end), blink-caret .75s step-end infinite;
          animation-iteration-count: infinite;
          animation-direction: alternate;
        }
        @keyframes typing {
          from { width: 0 }
          to { width: 100% }
        }
        @keyframes blink-caret {
          from, to { border-color: transparent }
          50% { border-color: #38BDF8; }
        }
        .gradient-text {
          background: linear-gradient(90deg, #7C3AED, #38BDF8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
      </style>
      <div class="container">
        <div class="glass-panel">
          <div class="greeting">Hello, I'm</div>
          <h1 class="name">Pari Meena</h1>
          <div class="typewriter-box">
            <div class="typewriter">Architecting systems. Crafting poetry. Breaking boundaries.</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
