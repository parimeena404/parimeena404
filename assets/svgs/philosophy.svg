<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 800 250" width="800" height="250">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap');
        * {
          box-sizing: border-box;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .container {
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent;
        }
        .card {
          width: 95%;
          height: 90%;
          background: #0D1117;
          border-radius: 12px;
          border: 1px solid rgba(124, 58, 237, 0.3);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          position: relative;
          padding: 24px 32px;
          overflow: hidden;
        }
        .card::before {
          content: "";
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 4px;
          background: linear-gradient(90deg, #7C3AED, #A855F7, #38BDF8);
        }
        .title {
          color: #A855F7;
          font-size: 1.25rem;
          font-weight: 700;
          margin: 0 0 16px 0;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .content {
          color: #C9D1D9;
          font-size: 1rem;
          line-height: 1.6;
          font-weight: 400;
        }
        .highlight {
          color: #ffffff;
          font-weight: 500;
          border-bottom: 1px dashed #38BDF8;
        }
        .quote-icon {
          color: rgba(124, 58, 237, 0.2);
          font-size: 4rem;
          position: absolute;
          bottom: 10px;
          right: 20px;
          font-family: serif;
        }
      </style>
      <div class="container">
        <div class="card">
          <h2 class="title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Engineering Philosophy
          </h2>
          <div class="content">
            I believe that great software is like poetry—<span class="highlight">concise, expressive, and deeply impactful</span>. As a woman in tech and a published author, I approach engineering not just as typing code, but as architecting solutions for real human problems. I write <span class="highlight">clean, scalable, and secure systems</span> while maintaining a relentless focus on the user experience. Whether it's building a hidden SOS trigger or a robust tracking system, my code is driven by purpose.
          </div>
          <div class="quote-icon">"</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
